name: 2차 랠리 기간 조사

on:
  push:
    branches: [main]
    paths:
      - "ripple/scripts/second_rally.py"
      - ".github/workflows/second_rally.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 ripple/scripts/second_rally.py
      - name: 결과 커밋
        run: |
          git config user.name "ripple-bot"
          git config user.email "ripple-bot@users.noreply.github.com"
          git add ripple/data/second_rally.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "second_rally: 조사 결과 갱신"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
