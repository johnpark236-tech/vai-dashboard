name: 전조-눌림목 수치 탐색

on:
  push:
    branches: [main]
    paths:
      - "ripple/scripts/precursor_search.py"
      - ".github/workflows/precursor_search.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: precursor-search
  cancel-in-progress: true

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 수치 탐색
        run: python3 ripple/scripts/precursor_search.py
      - name: 결과 커밋
        run: |
          git config user.name "ripple-bot"
          git config user.email "ripple-bot@users.noreply.github.com"
          git add ripple/data/precursor_search.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "precursor: 수치 탐색 결과 갱신"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
