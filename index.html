<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VAI Dashboard</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="./config.js"></script>
</head>
<body>
  <header class="topbar">
    <div>
      <h1>VAI Dashboard</h1>
      <p>Google 계정 로그인 기반 읽기 전용 가상매매 현황</p>
    </div>
    <button id="logoutBtn" class="ghost" hidden>로그아웃</button>
  </header>

  <main>
    <section id="loginPanel" class="login-panel">
      <h2>Google 로그인</h2>
      <p id="configStatus">설정을 확인하는 중입니다.</p>
      <div id="g_id_onload"></div>
      <div class="g_id_signin" data-type="standard" data-size="large" data-theme="outline" data-text="signin_with" data-shape="rectangular"></div>
      <p class="fine">허용된 Google 계정만 접근할 수 있습니다. 비밀번호는 VAI가 수집하거나 저장하지 않습니다.</p>
    </section>

    <section id="dashboard" hidden>
      <div class="summary-grid" id="summaryGrid"></div>

      <section class="panel">
        <h2>계좌별 가상 잔고</h2>
        <div class="table-wrap"><table id="accountsTable"></table></div>
      </section>

      <section class="split">
        <div class="panel">
          <h2>한온시스템 018880</h2>
          <div id="hourlyPanel"></div>
        </div>
        <div class="panel">
          <h2>Telegram / 백업</h2>
          <div id="opsPanel"></div>
        </div>
      </section>

      <section class="panel">
        <h2>시간별 가상매매</h2>
        <div class="timeline" id="timeline"></div>
      </section>

      <section class="panel">
        <h2>거래 내역</h2>
        <div class="filters">
          <input id="filterText" placeholder="계좌, 종목, 전략 검색">
          <button id="csvBtn">CSV</button>
        </div>
        <div class="table-wrap"><table id="tradesTable"></table></div>
      </section>

      <section class="split">
        <div class="panel"><h2>일별 실현손익</h2><canvas id="pnlChart"></canvas></div>
        <div class="panel"><h2>계좌별 수익률</h2><canvas id="returnChart"></canvas></div>
      </section>

      <section class="panel">
        <h2>시스템 운영 상태</h2>
        <ul class="services" id="services"></ul>
      </section>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
